# =============================================================================
# ThinkPad EtherCAT 实验口：勿让 NetworkManager 在 carrier 上来后 DHCP。
#
# 背景：
#   EtherCAT 主站（如 SOEM）在此口上发二层 EtherType 0x88A4 帧。
#   管理/互联网流量应走 Wi-Fi（如 wlp0s20f3），不要与实验口混用。
#
# 安装：
#   sudo ./deploy/ethercat/apply_nm_unmanaged.sh --apply
#   或手动拷到 /etc/NetworkManager/conf.d/ 后 systemctl reload NetworkManager
#
# 换接口名时：同步改下方 interface-name，并复跑
#   sudo ./linux/scripts/collect_ethercat_nic_gate.sh
# 更新 docs/ETHERCAT_NIC_GATE.md 时间戳引用。
#
# 本文件不证明：OP / PDO / WKC；只服务 Gate G4（管理面隔离）。
# =============================================================================
[keyfile]
unmanaged-devices=interface-name:enp0s31f6
